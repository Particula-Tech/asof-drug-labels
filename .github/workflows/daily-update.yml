# Daily update of both corpora (tools/daily.py, docs/daily-update.md).
# Appends the day's new DailyMed versions and Commission decisions to us/ and eu/ (submodules), tags both
# daily/<date>, and commits sources, molecules, manifest.json, README numbers and reports/daily/<date> here.
name: Daily update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Run date YYYY-MM-DD (empty: today, UTC)'
        required: false
        type: string
      dry_run:
        description: 'Plan only: no pin, commit, tag or push'
        required: false
        type: boolean
        default: false

# The job token stays read-only: every push uses the token that actions/checkout persists
# (secrets.ASOF_PUSH_TOKEN, a fine-grained token with Contents read and write on this repo and both corpus repos).
permissions:
  contents: read

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  daily:
    # Apple Silicon, so pip installs the same PyMuPDF wheel (same SHA-256) as the machine that built eu/,
    # and the converter identity 'eu_qrd 4 (PyMuPDF 1.27.2.2)' stays the same.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ASOF_PUSH_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned PDF converter
        run: |
          python3 -m pip install --require-hashes --only-binary :all: -r tools/requirements-eu.txt

      - name: Git identity
        run: |
          for repo in . us eu; do
            git -C "$repo" config user.name "asof-drug-labels daily job"
            git -C "$repo" config user.email "daily@labels.invalid"
          done

      - name: Run date
        id: day
        env:
          RUN_DATE: ${{ inputs.date }}
        run: |
          day="${RUN_DATE:-$(date -u +%F)}"
          [[ $day =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'bad date'; exit 1; }
          echo "day=$day" >> "$GITHUB_OUTPUT"

      - name: Run
        env:
          ASOF_US_REPO: us
          ASOF_EU_REPO: eu
          ASOF_EU_PYTHON: python3
          ASOF_RAW: ${{ github.workspace }}/raw
          DRY_RUN: ${{ inputs.dry_run }}
          DAY: ${{ steps.day.outputs.day }}
        run: |
          DRY_ARG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_ARG="--dry-run"; fi
          python3 -I tools/daily.py run --date "$DAY" --sweep-on-sunday $DRY_ARG

      - name: Keep the day's raw files (listing pages, zips, PDFs, converter outputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-daily-${{ steps.day.outputs.day }}
          path: raw/daily/${{ steps.day.outputs.day }}/
          retention-days: 90
          if-no-files-found: ignore

      - name: Push
        # only the default branch records the corpus history (daily.py push refuses any other branch too)
        if: ${{ inputs.dry_run != true && github.ref == 'refs/heads/main' }}
        env:
          ASOF_US_REPO: us
          ASOF_EU_REPO: eu
          DAY: ${{ steps.day.outputs.day }}
        run: python3 -I tools/daily.py push --date "$DAY"

      - name: Run summary
        if: always()
        env:
          DAY: ${{ steps.day.outputs.day }}
        run: |
          report="reports/daily/$DAY.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; else echo "No report written." >> "$GITHUB_STEP_SUMMARY"; fi
