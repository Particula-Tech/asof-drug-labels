<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Chantix: 43 label versions since 2007. The boxed warning appeared on 29 Jul 2009, changed 3 times (plus 3 format conversions), and was gone on 14 Mar 2017.</title>
<desc>One row per part of the label, one tick per version that changed it.</desc>
<rect width="1080" height="1350" fill="#FFFFFF"/>
<text x="64" y="105.6" font-size="52" fill="#1F2937" font-weight="600">Chantix: 43 label versions since</text>
<text x="64" y="168" font-size="52" fill="#1F2937" font-weight="600">2007. The boxed warning appeared</text>
<text x="64" y="230.4" font-size="52" fill="#1F2937" font-weight="600">on 29 Jul 2009, changed 3 times</text>
<text x="64" y="292.8" font-size="52" fill="#1F2937" font-weight="600">(plus 3 format conversions), and</text>
<text x="64" y="355.2" font-size="52" fill="#1F2937" font-weight="600">was gone on 14 Mar 2017.</text>
<text x="64" y="402.2" font-size="30" fill="#6B7280">Each tick is a version of the Chantix label (DailyMed setid f0ff4f27)</text>
<text x="64" y="441.2" font-size="30" fill="#6B7280">that added, changed or removed that part of the label.</text>
<text x="1016" y="1310" font-size="22" fill="#6B7280" text-anchor="end">Built 2026-11-07 · US 52a5f80</text>
<text x="64" y="1310" font-size="22" fill="#6B7280">claimed.</text>
<text x="64" y="1281.4" font-size="22" fill="#6B7280">medicines only; no affiliation with or endorsement by any manufacturer, FDA or NLM is</text>
<text x="64" y="1252.8" font-size="22" fill="#6B7280">FDA approval dates. Independent project by Particula Tech; product names identify the</text>
<text x="64" y="1224.2" font-size="22" fill="#6B7280">DailyMed versions as of 30 Oct 2026; dates are when DailyMed showed each version, not</text>
<text x="64" y="1195.6" font-size="22" fill="#6B7280">Source: NLM DailyMed, via Particula-Tech/asof-drug-labels. Counts are of captured</text>
<line x1="64" y1="1155" x2="1016" y2="1155" stroke="#E5E7EB" stroke-width="1"/>
<text x="64" y="1136.4" font-size="22" fill="#6B7280">first column are the first version on DailyMed (7 Jun 2007).</text>
<text x="64" y="1107.8" font-size="22" fill="#6B7280">between the old and the new label format, so most sections changed at once. Ticks in the</text>
<text x="64" y="1079.2" font-size="22" fill="#6B7280">Method: Hollow ticks: label versions 9, 10 and 11 (4 Mar 2010 to 30 Apr 2010) switched</text>
<line x1="411.18" y1="536.2" x2="411.18" y2="1006.6" stroke="#E5E7EB" stroke-width="1"/>
<text x="411.18" y="1034.6" font-size="22" fill="#6B7280" text-anchor="middle">2007</text>
<line x1="501.5" y1="536.2" x2="501.5" y2="1006.6" stroke="#E5E7EB" stroke-width="1"/>
<text x="501.5" y="1034.6" font-size="22" fill="#6B7280" text-anchor="middle">2010</text>
