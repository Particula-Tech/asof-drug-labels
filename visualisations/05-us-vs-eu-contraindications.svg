<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>In 39 of 122 molecules, only one of the US and EU labels lists a contraindication beyond hypersensitivity (30 Oct 2026)</title>
<desc>Two lists of molecule names: where only the EU SmPC section 4.3 lists a contraindication beyond hypersensitivity, and where only the US Contraindications section does.</desc>
<rect width="1080" height="1350" fill="#FFFFFF"/>
<text x="64" y="105.6" font-size="52" fill="#1F2937" font-weight="600">In 39 of 122 molecules, only one of</text>
<text x="64" y="168" font-size="52" fill="#1F2937" font-weight="600">the US and EU labels lists a</text>
<text x="64" y="230.4" font-size="52" fill="#1F2937" font-weight="600">contraindication beyond</text>
<text x="64" y="292.8" font-size="52" fill="#1F2937" font-weight="600">hypersensitivity (30 Oct 2026)</text>
<text x="64" y="339.8" font-size="30" fill="#6B7280">US Contraindications section against EU SmPC section 4.3, for the</text>
<text x="64" y="378.8" font-size="30" fill="#6B7280">122 molecules whose EU reference product is comparable to the</text>
<text x="64" y="417.8" font-size="30" fill="#6B7280">US brand.</text>
<text x="1016" y="1310" font-size="22" fill="#6B7280" text-anchor="end">Built 2026-11-07 · US 52a5f80 · EU 69d4eae</text>
<text x="64" y="1310" font-size="22" fill="#6B7280">or the European Commission is claimed.</text>
<text x="64" y="1281.4" font-size="22" fill="#6B7280">the medicines only; no affiliation with or endorsement by any manufacturer, FDA, NLM, EMA</text>
<text x="64" y="1252.8" font-size="22" fill="#6B7280">versions as of 30 Oct 2026. Independent project by Particula Tech; product names identify</text>
<text x="64" y="1224.2" font-size="22" fill="#6B7280">Particula-Tech/asof-drug-labels. Counts are of captured DailyMed and Union Register</text>
<text x="64" y="1195.6" font-size="22" fill="#6B7280">Source: NLM DailyMed; European Commission Union Register and EMA; via</text>
<line x1="64" y1="1155" x2="1016" y2="1155" stroke="#E5E7EB" stroke-width="1"/>
<text x="64" y="1136.4" font-size="22" fill="#6B7280">patient.</text>
<text x="64" y="1107.8" font-size="22" fill="#6B7280">extracted Contraindications section does not establish absence of a risk or suitability for any</text>
<text x="64" y="1079.2" font-size="22" fill="#6B7280">decision in force on that date; every counted line passes check_citations. Absence from an</text>
<text x="64" y="1050.6" font-size="22" fill="#6B7280">sections only. US: what DailyMed showed on 30 Oct 2026; EU: Annex I of the Commission</text>
<text x="64" y="1022" font-size="22" fill="#6B7280">Warnings and Precautions or a boxed warning: the chart reads the Contraindications</text>
<text x="64" y="993.4" font-size="22" fill="#6B7280">sources/contraindication-descriptions.json. The other label may carry the same risk under</text>
<text x="64" y="964.8" font-size="22" fill="#6B7280">contraindications; two descriptive sentences are set aside by the committed table</text>
<text x="64" y="936.2" font-size="22" fill="#6B7280">SmPC carries the template line; intro lines, cross-references and "None." are not</text>
<text x="64" y="907.6" font-size="22" fill="#6B7280">Method: hypersensitivity and allergy items are set aside on both sides because every EU</text>
<text x="64" y="498.8" font-size="26" fill="#1F2937" font-weight="600">Only the EU SmPC lists one · 31</text>
<text x="1016" y="498.8" font-size="22" fill="#C2410C" text-anchor="end">None. = the US section reads "None."</text>
<line x1="64" y1="506.8" x2="1016" y2="506.8" stroke="#E5E7EB" stroke-width="1"/>
